<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Earth 2</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <!-- Introduction -->
        <div id="welcome-modal" class="modal-overlay">
            <div class="modal-content">
                <h1 id="intro-title">🌍 Terra 2 / Earth 2</h1>
                <p id="intro-text">Selecione seu idioma para começar:</p>
                
                <div class="lang-btns">
                    <button id="btn-pt" class="lang-btn">Português 🇧🇷</button>
                    <button id="btn-en" class="lang-btn">English 🇺🇸</button>
                </div>

                <div id="story-box" style="display: none;">
                    <p id="story-text"></p>
                    <button id="btn-start" class="start-btn">Começar Julgamento</button>
                </div>
            </div>
        </div>

        <!-- Main game -->
        <div class="main" id="game-container" style="display: none;">
            <!-- Character img -->
            <div class="character" id="character">
                <img src="human-image/human1.png" alt="Candidato">
            </div>

            <!-- Character Info -->
            <div class="info" id="info">
                <h1>Loading...</h1>
                <h3>-- anos • ---</h3>

                <h4>PROS</h4>
                <ul id="list-pros">
                    <li>Loading...</li>
                </ul>

                <h4>CONS</h4>
                <ul id="list-cons">
                    <li>Loading...</li>
                </ul>
            </div>

            <!-- Percentage data -->
            <div class="percentages" id="percentages">
                <div class="percentage-label">
                    <span style="color: var(--green);"><span id="label-earth2">Earth 2</span>: <span id="val-green">50%</span></span>
                    <span style="color: var(--red);"><span id="label-defeated">Defeated</span>: <span id="val-red">50%</span></span>
                </div>
                <div id="percentage-bar-container">
                    <div id="percentage-green"></div> 
                </div>
             </div>

            <!-- Action Button -->
            <div class="btns">
                <button id="btn-green" title="Send to Earth 2"></button> <!-- Btn to send to Earth 2 -->
                <button id="btn-yellow" title="Next"></button>           <!-- Btn to call next human -->
                <button id="btn-red" title="Defeat"></button>            <!-- Btn to "defeat" human -->
            </div>
        </div>

        <script type="module" src="script.js"></script>
    </body>
</html>
