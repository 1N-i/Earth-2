<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Terra 2</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="main">
            <!-- Character Image -->
            <div class="character" id="character">
                <img src="human-image/human1.png" alt="Candidato">
            </div>

            <!-- Character Info -->
            <div class="info" id="info">
                <h1>CARREGANDO...</h1>
                <h3>-- anos • ---</h3>

                <h4>PRÓS</h4>
                <ul>
                    <li>Carregando...</li>
                </ul>

                <h4>CONTRAS</h4>
                <ul>
                    <li>Carregando...</li>
                </ul>
            </div>

            <!-- Percentage data -->
            <div class="percentages" id="percentages">
                <div class="percentage-label">
                    <span style="color: var(--green);">Terra 2: <span id="val-green">50%</span></span>
                    <span style="color: var(--red);">Eliminados: <span id="val-red">50%</span></span>
                </div>
                <div id="percentage-bar-container">
                    <div id="percentage-green"></div> 
                </div>
             </div>

            <!-- Action Button -->
            <div class="btns">
                <button id="btn-green" title="Send to Earth 2"></button> <!-- Btn to send to Earth 2 -->
                <button id="btn-yellow" title="Next"></button>           <!-- Btn to call next human -->
                <button id="btn-red" title="Defeat"></button>            <!-- Btn to "defeat" human -->
            </div>
        </div>

        <script type="module" src="script.js"></script>
    </body>
</html>
