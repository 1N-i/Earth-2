<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Earth 2</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="main">
            <!-- Character image or GIF -->
            <div class="character">
                <img src="https://www.21-draw.com/wp-content/uploads/2022/06/simple-shapes-on-character-design-sheet-1024x1024.jpg">
            </div>

            <!-- Character info -->
            <div class="info">
                <h1>HELENA VANCE</h1>
                <h3>34 years • Agricultural Engineer</h3>

                <h4>PROS</h4>
                <ul>
                    <li>✔ Mastered the purification of radioactive soil</li>
                    <li>✔ Calm demeanor in crisis situations</li>
                </ul>

                <h4>CONS</h4>
                <ul>
                    <li>✖ History of critical insubordination</li>
                    <li>✖ Refuses to work under military command</li>
                </ul>
            </div>

            <!-- Buttons -->
            <div class="btns">
                <button id="btn-green"></button>  <!-- Btn to send to Earth 2 -->
                <button id="btn-yellow"></button> <!-- Btn to call next human -->
                <button id="btn-red"></button>    <!-- Btn to "defeat" human -->
            </div>

            <!-- Percentages -->
             <div class="percentages">
                <div id="percentage-red"><div id="percentage-green"></div></div> 
             </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
